<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SRT 字幕語義分割與繁英處理工具</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-color: #bb86fc;
      --accent-hover: #9965f4;
      --text-color: #e0e0e0;
      --text-muted: #a0a0a0;
      --border-color: #333333;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 800px;
      width: 100%;
      background-color: var(--card-bg);
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    h1 {
      margin-top: 0;
      color: var(--accent-color);
      font-size: 24px;
    }
    .field {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-muted);
      font-size: 14px;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px;
      background: #2a2a2a;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      color: #fff;
      box-sizing: border-box;
    }
    .drop-zone {
      border: 2px dashed var(--border-color);
      padding: 30px;
      text-align: center;
      border-radius: 6px;
      cursor: pointer;
      background: #252525;
      transition: border 0.3s;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--accent-color);
    }
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    button {
      background-color: var(--accent-color);
      color: #000;
      border: none;
      padding: 12px 20px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background-color: var(--accent-hover);
    }
    button:disabled {
      background-color: #555;
      cursor: not-allowed;
    }
    .btn-secondary {
      background-color: #333;
      color: #fff;
    }
    .btn-secondary:hover {
      background-color: #444;
    }
    #status {
      margin-top: 15px;
      font-size: 14px;
      color: var(--accent-color);
    }
  </style>
</head>
<body>

<div class="container">
  <h1>SRT 字幕語義分割處理工具</h1>
  
  <div class="field">
    <label for="apiKey">Gemini API Key:</label>
    <input type="password" id="apiKey" placeholder="請輸入 Gemini API Key">
  </div>

  <div class="field">
    <label>選擇或拖放 SRT 檔案：</label>
    <div class="drop-zone" id="dropZone">
      點擊選擇檔案，或將 .srt 檔案拖放至此處
      <input type="file" id="fileInput" accept=".srt" style="display: none;">
    </div>
  </div>

  <div class="field">
    <label for="fileName">目前檔案：</label>
    <input type="text" id="fileName" readonly placeholder="未選擇檔案">
  </div>

  <div class="btn-group">
    <button id="processBtn">開始處理字幕</button>
  </div>

  <div id="status"></div>

  <div class="btn-group" id="downloadArea" style="display: none;">
    <button id="dlZhBtn" class="btn-secondary">下載繁體中文 SRT</button>
    <button id="dlEnBtn" class="btn-secondary">下載英文 SRT</button>
    <button id="dlZipBtn">打包下載 (ZIP)</button>
  </div>
</div>

<script>
  const apiKeyInput = document.getElementById('apiKey');
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const fileNameDisplay = document.getElementById('fileName');
  const processBtn = document.getElementById('processBtn');
  const statusDiv = document.getElementById('status');
  const downloadArea = document.getElementById('downloadArea');
  const dlZhBtn = document.getElementById('dlZhBtn');
  const dlEnBtn = document.getElementById('dlEnBtn');
  const dlZipBtn = document.getElementById('dlZipBtn');

  let loadedFileContent = '';
  let currentFileName = 'subtitles';
  let resultZhSrt = '';
  let resultEnSrt = '';

  // 讀取/儲存 API Key
  apiKeyInput.value = localStorage.getItem('gemini_api_key') || '';
  apiKeyInput.addEventListener('change', () => {
    localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());
  });

  // 檔案拖放與選擇處理
  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length > 0) {
      handleFile(e.dataTransfer.files[0]);
    }
  });
  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length > 0) {
      handleFile(e.target.files[0]);
    }
  });

  function handleFile(file) {
    if (!file.name.endsWith('.srt')) {
      alert('請上傳 .srt 格式檔案');
      return;
    }
    currentFileName = file.name.replace(/\.srt$/i, '');
    fileNameDisplay.value = file.name;
    const reader = new FileReader();
    reader.onload = (e) => {
      loadedFileContent = e.target.result;
    };
    reader.readAsText(file);
  }

  // SRT 解析器
  function parseSRT(data) {
    const blocks = data.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n\n');
    const items = [];
    for (const block of blocks) {
      const lines = block.trim().split('\n');
      if (lines.length >= 3) {
        const index = lines[0].trim();
        const timecode = lines[1].trim();
        const text = lines.slice(2).join('\n').trim();
        items.push({ index, timecode, text });
      }
    }
    return items;
  }

  // API 呼叫處理
  processBtn.addEventListener('click', async () => {
    const apiKey = apiKeyInput.value.trim();
    if (!apiKey) {
      alert('請先輸入 API Key');
      return;
    }
    if (!loadedFileContent) {
      alert('請先選擇 SRT 檔案');
      return;
    }

    processBtn.disabled = true;
    downloadArea.style.display = 'none';
    statusDiv.textContent = '正在解析 SRT 檔案...';

    const items = parseSRT(loadedFileContent);
    const BATCH_SIZE = 40;
    const batches = [];
    for (let i = 0; i < items.length; i += BATCH_SIZE) {
      batches.push(items.slice(i, i + BATCH_SIZE));
    }

    let processedZhItems = [];
    let processedEnItems = [];

    for (let i = 0; i < batches.length; i++) {
      statusDiv.textContent = `正在處理第 ${i + 1} / ${batches.length} 批次字幕...`;
      try {
        const res = await processBatch(batches[i], apiKey);
        processedZhItems = processedZhItems.concat(res.zh);
        processedEnItems = processedEnItems.concat(res.en);
      } catch (err) {
        statusDiv.textContent = `處理失敗 (批次 ${i + 1}): ` + err.message;
        processBtn.disabled = false;
        return;
      }
    }

    resultZhSrt = buildSRT(processedZhItems);
    resultEnSrt = buildSRT(processedEnItems);

    statusDiv.textContent = '處理完成！請選擇下載方式。';
    processBtn.disabled = false;
    downloadArea.style.display = 'flex';
  });

  async function processBatch(batch, apiKey) {
    const promptText = `你是一個專業字幕切割與翻譯助手。
【嚴格規則】
1. 中文輸出必須「完全使用台灣/香港繁體中文（Traditional Chinese）」，絕對禁止出現任何簡體字。
2. 英文輸出請自動修正句首大小寫與標點符號。
3. 嚴禁修改、刪除或增添原始字幕的文字意思。
4. 輸入字幕包含 id, timecode, text。請依據語義合理切分，並依比例劃分時間軸。

請將以下批次資料處理後，嚴格回傳 JSON 格式：
[
  ${batch.map(item => JSON.stringify(item)).join(',\n')}
]

回傳 JSON 結構必須為：
{
  "zh": [ {"index": "1", "timecode": "00:00:00,000 --> 00:00:02,000", "text": "繁體中文文字"} ],
  "en": [ {"index": "1", "timecode": "00:00:00,000 --> 00:00:02,000", "text": "English text"} ]
}`;

    // Endpoint 使用 gemini-3.5-flash-lite
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${apiKey}`;
    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts: [{ text: promptText }] }],
        generationConfig: { responseMimeType: "application/json" }
      })
    });

    if (!response.ok) {
      throw new Error(`API HTTP Error: ${response.status}`);
    }

    const resData = await response.json();
    const rawContent = resData.candidates[0].content.parts[0].text;
    return JSON.parse(rawContent);
  }

  function buildSRT(items) {
    return items.map((item, idx) => {
      return `${idx + 1}\n${item.timecode}\n${item.text}`;
    }).join('\n\n');
  }

  function downloadFile(content, filename) {
    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    link.click();
    URL.revokeObjectURL(link.href);
  }

  dlZhBtn.addEventListener('click', () => {
    downloadFile(resultZhSrt, `${currentFileName}_繁體.srt`);
  });

  dlEnBtn.addEventListener('click', () => {
    downloadFile(resultEnSrt, `${currentFileName}_英文.srt`);
  });

  dlZipBtn.addEventListener('click', async () => {
    const zip = new JSZip();
    zip.file(`${currentFileName}_繁體.srt`, resultZhSrt);
    zip.file(`${currentFileName}_英文.srt`, resultEnSrt);
    const content = await zip.generateAsync({ type: 'blob' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(content);
    link.download = `${currentFileName}_字幕包.zip`;
    link.click();
    URL.revokeObjectURL(link.href);
  });
</script>

</body>
</html>
