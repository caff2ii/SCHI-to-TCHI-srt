<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRT 雙語 AI 翻譯器 (Gemini 3.5 Flash Lite - 暗黑模式)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --text-secondary: #a0a0a0;
            --border-color: #333333;
            --input-bg: #2a2a2a;
            --primary-color: #0a84ff;
            --primary-hover: #0066cc;
            --button-disabled: #444444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        .container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
        }

        h1 {
            margin-top: 0;
            font-size: 24px;
            color: #ffffff;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-color);
        }

        input[type="text"],
        input[type="password"],
        textarea,
        input[type="file"],
        input[type="number"],
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: var(--input-bg);
            color: var(--text-color);
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        textarea:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: var(--button-disabled);
            color: #888888;
            cursor: not-allowed;
        }

        .btn-secondary {
            background-color: #333333;
            color: #ffffff;
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background-color: #444444;
        }

        .download-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .download-group button {
            flex: 1;
            min-width: 180px;
        }

        #status {
            margin-top: 15px;
            font-weight: bold;
            white-space: pre-line;
            color: #34c759;
        }

        .error-status {
            color: #ff453a !important;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>SRT 雙語 AI 翻譯器 (Gemini 3.5 Flash Lite) v4.0</h1>
    
    <div class="form-group">
        <label for="apiKey">Gemini API Key:</label>
        <input type="password" id="apiKey" placeholder="請輸入你的 Gemini API Key">
    </div>

    <div class="form-group">
        <label for="targetLang">目標輸出語言:</label>
        <select id="targetLang">
            <option value="both">香港繁體中文 + 英文 (分開 / 打包 ZIP 下載)</option>
            <option value="zh">僅香港繁體中文</option>
            <option value="en">僅英文</option>
        </select>
    </div>

    <div class="form-group">
        <label for="batchSize">每批處理字幕條數 (建議 30-50 條):</label>
        <input type="number" id="batchSize" value="40" min="10" max="100">
    </div>

    <div class="form-group">
        <label for="referenceTranscript">參考 Teleprompter 讀稿機文本 / Transcript (選填):</label>
        <textarea id="referenceTranscript" placeholder="請在此貼上原始 Teleprompter 稿件或參考 Transcript。AI 會優先參考此文本中的專有名詞、品牌與用語風格來進行翻譯..."></textarea>
    </div>

    <div class="form-group">
        <label for="srtFile">選擇 SRT 檔案:</label>
        <input type="file" id="srtFile" accept=".srt">
    </div>

    <button id="convertBtn" onclick="processSRT()">開始轉換</button>

    <div id="status"></div>

    <div id="downloadArea" class="download-group" style="display: none;">
        <button id="dlZhBtn" class="btn-secondary" onclick="downloadZh()">下載香港繁體 SRT</button>
        <button id="dlEnBtn" class="btn-secondary" onclick="downloadEn()">下載英文 SRT</button>
        <button id="dlZipBtn" onclick="downloadZip()">打包下載 (ZIP)</button>
    </div>
</div>

<script>
let globalZhSRT = '';
let globalEnSRT = '';
let globalBaseFileName = 'subtitles';

document.addEventListener('DOMContentLoaded', () => {
    const savedApiKey = localStorage.getItem('gemini_api_key');
    if (savedApiKey) {
        document.getElementById('apiKey').value = savedApiKey;
    }
});

function parseSRT(text) {
    const normalizedText = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    const blocks = normalizedText.trim().split(/\n\n+/);
    const parsed = [];

    for (const block of blocks) {
        const lines = block.split('\n');
        if (lines.length >= 3) {
            const index = lines[0].trim();
            const time = lines[1].trim();
            const content = lines.slice(2).join('\n').trim();
            parsed.push({ index, time, content });
        }
    }
    return parsed;
}

async function processSRT() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const targetLang = document.getElementById('targetLang').value;
    const batchSize = parseInt(document.getElementById('batchSize').value, 10) || 40;
    const referenceTranscript = document.getElementById('referenceTranscript').value.trim();
    const fileInput = document.getElementById('srtFile');
    const statusDiv = document.getElementById('status');
    const convertBtn = document.getElementById('convertBtn');
    const downloadArea = document.getElementById('downloadArea');

    statusDiv.classList.remove('error-status');
    downloadArea.style.display = 'none';

    if (!apiKey) {
        alert('請輸入 Gemini API Key！');
        return;
    }
    if (fileInput.files.length === 0) {
        alert('請選擇一個 SRT 檔案！');
        return;
    }

    localStorage.setItem('gemini_api_key', apiKey);

    const file = fileInput.files[0];
    globalBaseFileName = file.name.replace(/\.srt$/i, '');
    const reader = new FileReader();

    reader.onload = async function(e) {
        const srtContent = e.target.result;
        const items = parseSRT(srtContent);
        
        if (items.length === 0) {
            alert('無法解析 SRT 檔案內容！');
            return;
        }

        convertBtn.disabled = true;
        
        const totalBatches = Math.ceil(items.length / batchSize);
        let zhItems = [];
        let enItems = [];

        try {
            for (let i = 0; i < totalBatches; i++) {
                const chunk = items.slice(i * batchSize, (i + 1) * batchSize);
                statusDiv.innerText = `正在處理第 ${i + 1} / ${totalBatches} 批字幕 (第 ${i * batchSize + 1} 至 ${Math.min((i + 1) * batchSize, items.length)} 條)...`;
                
                const batchResult = await translateBatch(apiKey, chunk.map(item => item.content), referenceTranscript, targetLang);
                
                for (let j = 0; j < chunk.length; j++) {
                    if (targetLang === 'zh' || targetLang === 'both') {
                        zhItems.push({
                            index: chunk[j].index,
                            time: chunk[j].time,
                            content: batchResult.zh[j] || chunk[j].content
                        });
                    }
                    if (targetLang === 'en' || targetLang === 'both') {
                        enItems.push({
                            index: chunk[j].index,
                            time: chunk[j].time,
                            content: batchResult.en[j] || chunk[j].content
                        });
                    }
                }
            }

            globalZhSRT = zhItems.map(item => `${item.index}\n${item.time}\n${item.content}`).join('\n\n');
            globalEnSRT = enItems.map(item => `${item.index}\n${item.time}\n${item.content}`).join('\n\n');

            document.getElementById('dlZhBtn').style.display = (targetLang === 'en') ? 'none' : 'block';
            document.getElementById('dlEnBtn').style.display = (targetLang === 'zh') ? 'none' : 'block';
            document.getElementById('dlZipBtn').style.display = (targetLang === 'both') ? 'block' : 'none';

            statusDiv.innerText = '轉換完成！請選擇點擊下載按鈕：';
            downloadArea.style.display = 'flex';
        } catch (error) {
            console.error(error);
            statusDiv.classList.add('error-status');
            statusDiv.innerText = '發生錯誤: ' + error.message;
        } finally {
            convertBtn.disabled = false;
        }
    };

    reader.readAsText(file);
}

async function translateBatch(apiKey, textArray, refTranscript, targetLang) {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${apiKey}`;

    let prompt = `你是一個專業雙語字幕翻譯員。\n`;
    prompt += `【最高優先度規則】\n`;
    prompt += `1. 所有中文翻譯（zh）必須「完全使用香港繁體中文（Traditional Chinese, Hong Kong）」，用語與標點符號必須符合香港習慣。絕對禁止使用任何簡體字或大陸用語！\n`;
    prompt += `2. 英文（en）翻譯必須自然流暢，適合影片字幕長度與口語表達。\n`;
    prompt += `3. 必須嚴格保持輸入與輸出陣列的元素數量與順序完全一致，絕對不可增減陣列長度。\n`;
    prompt += `4. 再次強調：即使是最後一批字幕，中文也絕對不能混入任何簡體字！\n\n`;
    
    if (targetLang === 'both') {
        prompt += `請輸出 JSON 物件，格式：{"zh": ["香港繁體1", "香港繁體2"], "en": ["English 1", "English 2"]}\n`;
    } else if (targetLang === 'zh') {
        prompt += `請輸出 JSON 物件，格式：{"zh": ["香港繁體1", "香港繁體2"]}\n`;
    } else {
        prompt += `請輸出 JSON 物件，格式：{"en": ["English 1", "English 2"]}\n`;
    }

    if (refTranscript) {
        prompt += `\n參考 Teleprompter 讀稿機文本 / Transcript：\n${refTranscript}\n`;
    }

    prompt += `\n需要翻譯的字幕陣列 JSON：\n${JSON.stringify(textArray)}`;

    const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: {
                responseMimeType: "application/json"
            }
        })
    });

    if (!response.ok) {
        const errData = await response.json();
        throw new Error(errData.error?.message || 'API 請求失敗');
    }

    const data = await response.json();
    let resultText = data.candidates[0].content.parts[0].text;

    try {
        const parsedObject = JSON.parse(resultText);
        let resZh = textArray;
        let resEn = textArray;

        if (parsedObject.zh && Array.isArray(parsedObject.zh) && parsedObject.zh.length === textArray.length) {
            resZh = parsedObject.zh;
        }
        if (parsedObject.en && Array.isArray(parsedObject.en) && parsedObject.en.length === textArray.length) {
            resEn = parsedObject.en;
        }

        return { zh: resZh, en: resEn };
    } catch (e) {
        console.warn('JSON 解析失敗', e);
    }
    
    return { zh: textArray, en: textArray };
}

function triggerDownload(content, filename) {
    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(link.href);
}

function downloadZh() {
    triggerDownload(globalZhSRT, `${globalBaseFileName}_香港繁體.srt`);
}

function downloadEn() {
    triggerDownload(globalEnSRT, `${globalBaseFileName}_English.srt`);
}

async function downloadZip() {
    const zip = new JSZip();
    zip.file(`${globalBaseFileName}_香港繁體.srt`, globalZhSRT);
    zip.file(`${globalBaseFileName}_English.srt`, globalEnSRT);
    const content = await zip.generateAsync({ type: 'blob' });
    
    const link = document.createElement('a');
    link.href = URL.createObjectURL(content);
    link.download = `${globalBaseFileName}_字幕包.zip`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(link.href);
}
</script>

</body>
</html>
